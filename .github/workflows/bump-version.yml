name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  create-pr:
    name: Create bump version PR
    if: github.repository == 'rstackjs/agent-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BUMP: ${{ inputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Create release branch
        run: |
          set -euo pipefail
          VERSION=$(node scripts/bump-version.mjs "$BUMP")
          BRANCH_NAME="chore-bump-$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH_NAME already exists."
            exit 1
          fi
          git switch -c "$BRANCH_NAME"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .claude-plugin/marketplace.json .claude-plugin/plugin.json .codex-plugin/plugin.json npm/maintainer-skills/package.json npm/skills/package.json plugin.json
          git commit -m "release: v$VERSION"

      - name: Push release branch
        run: git push -u origin "$BRANCH_NAME"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "release: v$VERSION" \
            --body "Bump release versions to v$VERSION."
