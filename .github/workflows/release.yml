name: Release

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag
        required: true
        type: choice
        default: alpha
        options: [alpha, beta, rc, canary, latest]
      npm_tag_confirm:
        description: Confirm npm dist-tag
        required: true
        type: choice
        options: [alpha, beta, rc, canary, latest]
      branch:
        description: Confirm the selected release branch
        required: true
        default: main
        type: string

permissions: {}

jobs:
  validate_inputs:
    name: Validate inputs
    if: github.repository == 'rstackjs/agent-skills'
    runs-on: ubuntu-latest
    steps:
      - name: Validate release branch and npm tag
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
          NPM_TAG: ${{ inputs.npm_tag }}
          NPM_TAG_CONFIRM: ${{ inputs.npm_tag_confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$RELEASE_BRANCH" ]; then
            echo "::error::Release branch must match the branch selected for this run."
            exit 1
          fi
          if [ "$NPM_TAG" != "$NPM_TAG_CONFIRM" ]; then
            echo "::error::npm_tag and npm_tag_confirm must match."
            exit 1
          fi

  release:
    name: Stage npm packages
    needs: validate_inputs
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Stage packages for publishing
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        # The workspace uses pnpm 10, which does not support staged publishing.
        run: npx --yes pnpm@12.23.0 --pm-on-fail=ignore --filter './npm/*' -r stage publish --tag "$NPM_TAG" --no-git-checks
